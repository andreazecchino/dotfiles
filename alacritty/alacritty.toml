[general]
import = [
  "~/.config/alacritty/keybindings/keybindings.toml",
  "~/.config/alacritty/themes/github-dark-dimmed.toml"
]
live_config_reload = true

[window]
dimensions = { columns = 180, lines = 60 }
startup_mode = "Windowed"
title = "Alacritty"
dynamic_title = true
decorations_theme_variant = "None"
decorations = "Full"
opacity = 1.0 # 0.95
# blur = true

[scrolling]
history = 10000
multiplier = 3

[font]
normal = { family = "Hack Nerd Font Mono", style = "Regular" }
size = 9.5
builtin_box_drawing = true

[selection]
semantic_escape_chars = ",│`|:\"' ()[]{}<>\t"
save_to_clipboard = true

[cursor]
style = { shape = "Block", blinking = "On" }
unfocused_hollow = true
thickness = 0.15
